# Stellar Bounty Board — Local Dev Stack Specification
#
# ==============================================================================
# Architectural Overview & Deviations from Framework Defaults
# ==============================================================================
# This Docker Compose file deviates deliberately from standard Docker / Compose
# defaults to satisfy monorepo security, service synchronization, and fast local dev:
#
# 1. Restart Policy (Default: "no" -> Deviation: "unless-stopped")
#    Compose defaults to never restarting crashed containers. We set "unless-stopped"
#    across all services so background microservices survive host sleep/wake and transient crashes.
#
# 2. Healthcheck Cadence (Default: interval: 30s, timeout: 30s, retries: 3)
#    Compose default 30s interval results in unacceptably sluggish feedback during boot (~1-2m).
#    We override to interval: 10s and timeout: 5s with custom start_period (10s-30s) so dependent
#    services start immediately once upstream dependencies report ready.
#
# 3. Port Publishing & Network Isolation
#    Instead of publishing all container ports to host interfaces, backend port 3001 is only
#    exposed internally. External client traffic must ingress through the Nginx reverse proxy.
#
# 4. Redis Ephemeral Mode
#    Redis default saves RDB snapshots and writes AOF logs to disk. We pass CLI flags
#    to disable persistence, ensuring a clean in-memory state on every run without disk wear.
# ==============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stellar-bounty-backend
    expose:
      # Deliberate deviation: Expose internally to compose network only.
      # Bypasses direct host port publishing to enforce Nginx reverse proxy routing.
      - '3001'
    environment:
      - NODE_ENV=development
      - PORT=3001
      # HTTP Keep-Alive & Header Timeouts (matches backend/src/index.ts):
      # Nginx reverse proxy default keepalive_timeout is 65s. Setting Node timeouts
      # to 65s/66s prevents race conditions where Node drops the connection before Nginx,
      # eliminating premature TCP resets (HTTP 502 Bad Gateway).
      - KEEP_ALIVE_TIMEOUT=65000
      - HEADERS_TIMEOUT=66000
      # Shared cache across replicas (#361); matches backend/src/services/cache.ts
      - REDIS_URL=redis://redis:6379
      # Persistent JSON store path (matches backend/src/store.ts):
      - BOUNTY_STORE_PATH=/app/data/bounties.json
    volumes:
      # Mount local data directory for file-backed JSON store persistence
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Verified against Alpine Linux environment (zero-dependency native Node / wget probe)
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health || node -e "require(\"http\").get(\"http://localhost:3001/api/health\", (r) => {if (r.statusCode !== 200) process.exit(1)})"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  nginx:
    # Deliberate version pin: 1.27-alpine ensures reproducible HTTP/2 & TLS behavior
    image: nginx:1.27-alpine
    container_name: stellar-bounty-nginx
    ports:
      # Standard HTTP and HTTPS ingress gateway ports
      - '80:80'
      - '443:443'
    volumes:
      # Deliberate deviation: Mount configuration and certificates as read-only (:ro)
      # to adhere to least-privilege container security practices.
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    # Pinned to stable major release 7-alpine (minimal attack surface)
    image: redis:7-alpine
    container_name: stellar-bounty-redis
    ports:
      - '6379:6379'
    # Ephemeral Cache Configuration (Deliberate deviation from Redis default persistence):
    # Local dev cache should never persist dirty data between teardowns.
    # Disabling RDB snapshots (--save "") and AOF (--appendonly no) prevents disk I/O
    # overhead and ensures clean, repeatable test state across container reboots.
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stellar-bounty-frontend
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=development
      # Reverse Proxy Routing (Deliberate deviation from direct localhost:3001 endpoint):
      # Points to http://nginx instead of backend port 3001 so that
      # client-side requests emulate the production topology (SSL termination, rate limiting).
      - NEXT_PUBLIC_API_URL=http://nginx
    depends_on:
      nginx:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
