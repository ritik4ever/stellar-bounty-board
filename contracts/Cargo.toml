[package]
name = "stellar-bounty-board"
version = "0.1.0"
edition = "2021"

[lib]
# Both: the wasm artifact CI uploads is a cdylib, and the integration tests
# under tests/ link the contract as a normal Rust library (which needs an rlib).
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "28.0.0"

[dev-dependencies]
soroban-sdk = { version = "28.0.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

