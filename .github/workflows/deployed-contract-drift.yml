name: Deployed Contract Drift

# Compares the WASM actually deployed at SOROBAN_CONTRACT_ID with a fresh build
# from the current default branch. The PR-triggered bindings-drift workflow only
# proves the checked-in bindings match the source; it cannot notice a deployment
# made from a stale commit. This check runs on its own schedule so a drifted
# deployment is reported even when nothing has been pushed.
on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deployed-contract-drift
  cancel-in-progress: false

jobs:
  deployed-wasm-drift:
    name: Compare deployed WASM hash with a fresh build
    runs-on: ubuntu-latest
    env:
      # Prefer a repository variable, fall back to a secret. Either works; both
      # are managed under Settings → Secrets and variables → Actions.
      SOROBAN_CONTRACT_ID: ${{ vars.SOROBAN_CONTRACT_ID || secrets.SOROBAN_CONTRACT_ID }}
      STELLAR_NETWORK: ${{ vars.STELLAR_NETWORK || 'testnet' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache rustup toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
          key: ${{ runner.os }}-rustup-toolchains
          restore-keys: |
            ${{ runner.os }}-rustup-toolchains

      - name: Setup Rust (wasm target)
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache contracts target
        uses: actions/cache@v4
        with:
          path: contracts/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Stellar CLI
        run: bash scripts/install-stellar-cli.sh

      - name: Build release WASM
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

      - name: Hash a fresh local build
        id: local
        run: |
          WASM_FILE=$(ls contracts/target/wasm32-unknown-unknown/release/*.wasm | head -n 1)
          if [ -z "$WASM_FILE" ]; then
            echo "::error::No WASM artifact found under contracts/target/wasm32-unknown-unknown/release."
            exit 1
          fi
          LOCAL_HASH=$(sha256sum "$WASM_FILE" | awk '{print $1}')
          echo "hash=$LOCAL_HASH" >> "$GITHUB_OUTPUT"
          echo "Local build: $WASM_FILE"
          echo "Local SHA-256: $LOCAL_HASH"

      - name: Fail fast when no contract ID is configured
        if: ${{ env.SOROBAN_CONTRACT_ID == '' }}
        run: |
          echo "::error::SOROBAN_CONTRACT_ID is not configured. Set the repository variable or secret so the deployed WASM can be verified."
          exit 1

      - name: Fetch the deployed WASM and hash it
        id: deployed
        if: ${{ env.SOROBAN_CONTRACT_ID != '' }}
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          stellar contract fetch \
            --id "$SOROBAN_CONTRACT_ID" \
            --network "$STELLAR_NETWORK" \
            --out-file deployed.wasm
          DEPLOYED_HASH=$(sha256sum deployed.wasm | awk '{print $1}')
          echo "hash=$DEPLOYED_HASH" >> "$GITHUB_OUTPUT"
          echo "Deployed SHA-256: $DEPLOYED_HASH"

      - name: Compare hashes
        id: compare
        if: ${{ env.SOROBAN_CONTRACT_ID != '' }}
        run: |
          LOCAL="${{ steps.local.outputs.hash }}"
          DEPLOYED="${{ steps.deployed.outputs.hash }}"

          if [ "$LOCAL" = "$DEPLOYED" ]; then
            echo "Deployed contract matches the source build ($LOCAL)."
            echo "mismatch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "mismatch=true" >> "$GITHUB_OUTPUT"
          echo "::error::Deployed contract WASM ($DEPLOYED) does not match a fresh build from source ($LOCAL). The deployment may be stale."
          exit 1

      - name: Report the mismatch on the summary
        if: ${{ always() && steps.compare.outputs.mismatch == 'true' }}
        run: |
          {
            echo "### Deployed contract drift detected"
            echo ""
            echo "- Contract ID: \`$SOROBAN_CONTRACT_ID\`"
            echo "- Network: \`$STELLAR_NETWORK\`"
            echo "- Source build SHA-256: \`${{ steps.local.outputs.hash }}\`"
            echo "- Deployed SHA-256: \`${{ steps.deployed.outputs.hash }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Alert on mismatch
        if: ${{ always() && steps.compare.outputs.mismatch == 'true' }}
        uses: actions/github-script@v7
        env:
          LOCAL_HASH: ${{ steps.local.outputs.hash }}
          DEPLOYED_HASH: ${{ steps.deployed.outputs.hash }}
          CONTRACT_ID: ${{ env.SOROBAN_CONTRACT_ID }}
          NETWORK: ${{ env.STELLAR_NETWORK }}
        with:
          script: |
            const title = 'Deployed contract WASM is out of sync with the source build';
            const marker = '<!-- deployed-contract-drift -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              `The scheduled **Deployed Contract Drift** check found that the WASM deployed at \`${process.env.CONTRACT_ID}\` (${process.env.NETWORK}) does not match a fresh build from the default branch.`,
              '',
              `- Source build SHA-256: \`${process.env.LOCAL_HASH}\``,
              `- Deployed SHA-256: \`${process.env.DEPLOYED_HASH}\``,
              `- Workflow run: ${runUrl}`,
              '',
              'A deployment made from a stale commit would otherwise go unnoticed. Rebuild and redeploy from the current default branch, or confirm the divergence is intentional.',
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const duplicate = existing.find((issue) => issue.title === title);

            if (duplicate) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: duplicate.number,
                body,
              });
              core.info(`Updated existing alert issue #${duplicate.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['area: contract', 'type: ci'],
              });
              core.info(`Opened alert issue #${created.data.number}.`);
            }
