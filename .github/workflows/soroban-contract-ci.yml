name: Soroban Contract CI

on:
  pull_request:
    branches: [main]

jobs:
  soroban:
    name: 'Soroban contract: clippy & test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache rustup toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.rustup/toolchains
          key: ${{ runner.os }}-rustup-toolchains
          restore-keys: |
            ${{ runner.os }}-rustup-toolchains

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache contracts target
        uses: actions/cache@v4
        with:
          path: contracts/target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('contracts/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      - name: Install Rust toolchain & wasm target
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32v1-none
          components: clippy
          profile: minimal
          override: true

      - name: Show Rust version
        run: rustc --version

      - name: Run cargo clippy
        working-directory: contracts
        run: cargo clippy --all-targets -- -D warnings

      - name: Run cargo test
        working-directory: contracts
        run: cargo test --all --verbose

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        working-directory: contracts
        run: |
          # Run cargo audit and fail on vulnerabilities.
          # Allowlist mechanism: add advisory IDs below to ignore specific
          # advisories, each with a rationale. New advisories still fail.
          #
          # Current allowlist (all transitively pinned by soroban-sdk 27;
          # fixing them requires an upstream soroban release):
          #   RUSTSEC-2026-0387  crypto-bigint 0.5.5 via k256/elliptic-curve
          #                      in soroban-env-host's host-side crypto; the
          #                      fix (>=0.7.6) is semver-incompatible.
          #   RUSTSEC-2026-0543  chrono unmaintained; pulled in by serde_with
          #                      through soroban-ledger-snapshot (test-only).
          #   RUSTSEC-2024-0436  paste unmaintained proc-macro; build-time
          #                      only, reached via ark-ff in soroban-env-host.
          #   RUSTSEC-2026-0574..0582  heapless 0.8 unsoundness; stellar-strkey
          #                      pins 0.8 and the fixes require the breaking
          #                      0.9.4 release, so the bump is upstream's.
          cargo audit --deny warnings \
            --ignore RUSTSEC-2026-0387 \
            --ignore RUSTSEC-2026-0543 \
            --ignore RUSTSEC-2024-0436 \
            --ignore RUSTSEC-2026-0574 \
            --ignore RUSTSEC-2026-0575 \
            --ignore RUSTSEC-2026-0576 \
            --ignore RUSTSEC-2026-0577 \
            --ignore RUSTSEC-2026-0578 \
            --ignore RUSTSEC-2026-0579 \
            --ignore RUSTSEC-2026-0580 \
            --ignore RUSTSEC-2026-0581 \
            --ignore RUSTSEC-2026-0582

      - name: Build release wasm
        working-directory: contracts
        run: cargo build --release --target wasm32v1-none

      - name: Report WASM size in summary
        run: |
          WASM_FILE=$(ls contracts/target/wasm32v1-none/release/*.wasm 2>/dev/null || true)
          if [ -n "$WASM_FILE" ]; then
            echo "### WASM binary size" >> $GITHUB_STEP_SUMMARY
            SIZE=$(stat -c%s "$WASM_FILE")
            echo "- File: $WASM_FILE" >> $GITHUB_STEP_SUMMARY
            echo "- Size (bytes): $SIZE" >> $GITHUB_STEP_SUMMARY
            GZ_SIZE=$(gzip -c "$WASM_FILE" | wc -c)
            echo "- Gzipped (bytes): $GZ_SIZE" >> $GITHUB_STEP_SUMMARY
            echo "WASM: $WASM_FILE ($SIZE bytes, $GZ_SIZE gzipped)"
          else
            echo "No wasm artifact found" >> $GITHUB_STEP_SUMMARY
            echo "No wasm artifact found"
            exit 1
          fi
