name: Testnet Auto-Deploy

on:
  push:
    branches: [main]
    paths:
      - "contracts/**"

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles("contracts/**/Cargo.toml") }}
      - name: Build and test contracts
        run: |
          for d in contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then
              echo "Building $d..."
              (cd "$d" && cargo build --target wasm32-unknown-unknown --release) || exit 1
              echo "Testing $d..."
              (cd "$d" && cargo test) || exit 1
            fi
          done

  deploy-testnet:
    needs: contract-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
      - name: Install Soroban CLI
        run: cargo install stellar-cli --features opt
      - name: Configure testnet
        env:
          STELLAR_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          stellar keys add deployer --secret-key "$STELLAR_KEY" || true
          stellar network add testnet --rpc-url https://soroban-testnet.stellar.org --network-passphrase "Test SDF Network ; September 2015"
      - name: Deploy contracts
        env:
          STELLAR_KEY: ${{ secrets.STELLAR_DEPLOYER_SECRET }}
        run: |
          echo "## Testnet Deployment" >> $GITHUB_STEP_SUMMARY
          for d in contracts/*/; do
            if [ -f "$d/Cargo.toml" ]; then
              NAME=$(basename "$d")
              WASM="$d/target/wasm32-unknown-unknown/release/${NAME}.wasm"
              if [ -f "$WASM" ]; then
                HASH=$(stellar contract install --wasm "$WASM" --source deployer --network testnet 2>/dev/null | tail -1)
                CID=$(stellar contract deploy --wasm-hash "$HASH" --source deployer --network testnet 2>/dev/null | tail -1)
                echo "- ${NAME}: ${CID}" >> $GITHUB_STEP_SUMMARY
                echo "Deployed $NAME -> $CID"
              fi
            fi
          done
      - name: Comment on PR
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const summary = fs.readFileSync(process.env.GITHUB_STEP_SUMMARY, "utf8");
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              head: context.sha
            });
            if (prs.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prs[0].number,
                body: "Testnet deployment completed:\n\n" + summary
              });
            }
