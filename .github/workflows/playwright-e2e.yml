name: Playwright E2E

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  e2e:
    name: Playwright E2E Tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Keep lifecycle coverage visible even if an unrelated E2E test fails.
      fail-fast: false
      matrix:
        include:
          - suite: lifecycle
            tests: playwright/tests/bounty-lifecycle.spec.ts
          - suite: full-suite
            tests: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci --legacy-peer-deps

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: npx playwright test ${{ matrix.tests }}

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.suite }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
