# Stellar Bounty Board gitleaks config (v8 format — compatible with
# gitleaks/gitleaks-action@v2, which runs gitleaks v8.x).

title = "Stellar Bounty Board gitleaks config"

# Extend the default rule set shipped with gitleaks.
[extend]
useDefault = true

# Allowlist known non-secret values so the scan doesn't fail on expected
# fixtures and docs. Keep this minimal — if you intentionally commit a real
# secret, the action should fail.
[allowlist]
description = "Env example placeholders, non-secret test fixtures, and public Soroban contract addresses"

# Regexes are matched against the leaked value.
regexes = [
  '''your_github_webhook_secret_here|example|EXAMPLE|dummy''',
  # Public Soroban/SAC contract addresses (e.g. testnet USDC token) — these are
  # on-chain identifiers, not credentials. Pattern: C + 55 base32 chars.
  '''C[A-Z2-7]{55}''',
  # Stellar public keys (G + 55 base32 chars) — public wallet addresses used as
  # mock fixtures in load tests and Playwright specs, not secrets.
  '''G[A-Z2-7]{55}''',
]

# Paths are regexes matched against file paths.
paths = [
  '''test/''',
  '''docs/''',
  '''.*\.md$''',
  '''backend/worker/''',
  '''backend/data/''',
  '''scripts/''',
  '''playwright/tests/''',
]
